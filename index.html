<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./static/css/app.css">
    <script src="static/js/pokemon.js" defer></script>
    <script type="module" src="./static/js/main.js"></script>
</head>
<body>

<header class="poke-header">
  <div class="poke-header__container">

    <a href="" class="poke-logo">
      <span class="pokeball"></span>
      <h1>PokéSite</h1>
    </a>

    <nav class="poke-nav">
      <ul>
        <li>
          <a href="#">
            <span class="pokedex-icon"></span>
            Pokédex
          </a>
        </li>
      </ul>
    </nav>

    <form class="poke-search">
      <input type="search" placeholder="Chercher un Pokémon…" />
      <button type="submit">OK</button>
    </form>

  </div>
</header>

    <main>
        <div id="container-loading">
            <div class="loader"></div>
            <h2>Chargement des pokémons</h2>
            <span id="loaded-value"></span><span>sur</span><span id="max-value"></span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Num pokedex</th>
                    <th>Nom</th>
                    <th>Type</th>
                    <th>Photo</th>
                    <th>Crie</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </main>

<footer>
    <div class="poke-footer__bottom-extra">
  <div class="poke-footer__logos">
    <a href="https://pokeapi.co/" target="_blank">
      <img src="./static/img/Logo_Pokeapi.png" alt="PokéAPI" />
    </a>
  </div>
  <div class="poke-footer__last-modified">
    Dernière modification : <span id="last-modified"></span>
  </div>
</div>
</footer>

</body>

</html>
